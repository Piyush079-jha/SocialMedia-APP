<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @keyframes light {
        0%   { stop-color: #4F75FF; }
        25%  { stop-color: #c4b5fd; }
        50%  { stop-color: #ffffff; }
        75%  { stop-color: #c4b5fd; }
        100% { stop-color: #4F75FF; }
      }
      @keyframes light2 {
        0%   { stop-color: #8B5CF6; }
        25%  { stop-color: #ffffff; }
        50%  { stop-color: #c4b5fd; }
        75%  { stop-color: #8B5CF6; }
        100% { stop-color: #8B5CF6; }
      }
      @keyframes star-pop {
        0%,80%  { opacity:0; transform: scale(0) rotate(0deg);   transform-origin:27px 5px; }
        88%     { opacity:1; transform: scale(1.4) rotate(20deg); transform-origin:27px 5px; }
        93%     { opacity:1; transform: scale(1) rotate(0deg);   transform-origin:27px 5px; }
        99%     { opacity:0; transform: scale(0.3) rotate(-10deg); transform-origin:27px 5px; }
        100%    { opacity:0; transform: scale(0) rotate(0deg);   transform-origin:27px 5px; }
      }
      @keyframes glow-pop {
        0%,80%  { opacity:0; }
        88%     { opacity:1; }
        96%     { opacity:0; }
        100%    { opacity:0; }
      }
      .n-letter { animation: none; }
      .g-stop1 { animation: light  4s ease-in-out infinite; }
      .g-stop2 { animation: light2 4s ease-in-out infinite; animation-delay:0.3s; }
      .star    { animation: star-pop  4s ease-in-out infinite; }
      .glow    { animation: glow-pop  4s ease-in-out infinite; }
    </style>

    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop class="g-stop1" offset="0%"  stop-color="#4F75FF"/>
      <stop class="g-stop2" offset="50%" stop-color="#8B5CF6"/>
      <stop class="g-stop1" offset="100%" stop-color="#4F75FF"/>
    </linearGradient>

    <filter id="gf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="sf" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1C1F2E"/>

  <!-- "N" letter with animated gradient -->
  <text
    x="16" y="23"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="20"
    fill="url(#ng)"
    filter="url(#gf)"
  >N</text>

  <!-- Star glow -->
  <circle class="glow" cx="27" cy="5" r="4"
    fill="rgba(255,215,0,0.5)"
    filter="url(#sf)"/>

  <!-- 4-point star at top-right of N -->
  <g class="star" filter="url(#sf)">
    <path
      d="M27,1 L27.9,4.1 L31,5 L27.9,5.9 L27,9 L26.1,5.9 L23,5 L26.1,4.1 Z"
      fill="#FFD700"
    />
    <path
      d="M27,3 L27.5,4.5 L29,5 L27.5,5.5 L27,7 L26.5,5.5 L25,5 L26.5,4.5 Z"
      fill="#FFF9C4"
    />
  </g>
</svg>
